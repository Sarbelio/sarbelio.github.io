<title>오늘 뭐 먹을까</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ee; --card:#fff; --ink:#2b2622; --muted:#7d736a; --line:#e6ddd1;
    --accent:#3d7a4f; --accent-soft:#e2f0e5; --warm:#c8641e; --warm-soft:#fbeadb;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#1a1916; --card:#25231f; --ink:#f2ede6; --muted:#aaa094; --line:#3b3732;
      --accent:#6cc283; --accent-soft:#1f3326; --warm:#f0955a; --warm-soft:#3a2a1e; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  button{touch-action:manipulation;-webkit-user-select:none;user-select:none}
  html,body{overscroll-behavior-y:none}
  .tip,.shop,.dish h3{-webkit-user-select:text;user-select:text}
  html{font-size:18px}
  html.big{font-size:21px !important}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;line-height:1.55}
  .wrap{max-width:640px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(70px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
  h1{font-size:1.75rem;font-weight:900;margin:0 0 4px;letter-spacing:-.5px}
  .sub{color:var(--muted);margin:0;font-size:1rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:16px}
  .q{font-size:1.1rem;font-weight:700;margin:0 0 10px}
  .q small{font-weight:400;color:var(--muted);font-size:.85rem;margin-left:4px}
  .big2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .bigopt{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:14px;padding:16px 10px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer}
  .bigopt span{display:block;font-size:.8rem;font-weight:400;color:var(--muted);margin-top:2px}
  .bigopt.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:9px 15px;border-radius:999px;font:inherit;font-size:1rem;cursor:pointer}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .toggles{display:flex;flex-direction:column;gap:10px}
  .tg{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;background:transparent;color:var(--ink);font:inherit;font-size:1.02rem;text-align:left}
  .tg .sw{width:50px;height:28px;border-radius:999px;background:var(--line);position:relative;flex:none;transition:.2s}
  .tg .sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
  .tg.on{border-color:var(--accent)}
  .tg.on .sw{background:var(--accent)}
  .tg.on .sw::after{left:25px}
  .go{display:block;width:100%;margin-top:18px;border:none;border-radius:16px;padding:18px;background:var(--warm);color:#fff;font:inherit;font-size:1.25rem;font-weight:900;cursor:pointer}
  .go:active,.btn:active,.bigopt:active,.chip:active,.tg:active,.swap:active{transform:scale(.97)}
  .addrow{display:flex;gap:8px}
  .addrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font:inherit;font-size:1rem;background:var(--bg);color:var(--ink);-webkit-appearance:none}
  .addrow input:focus{outline:none;border-color:var(--accent)}
  .addrow button{border:none;border-radius:12px;padding:0 20px;background:var(--accent);color:#fff;font:inherit;font-size:1rem;font-weight:700;cursor:pointer;flex:none}
  .hint{font-size:.85rem;color:var(--muted);margin:6px 0 10px}
  .chip.mine{background:var(--accent);border-color:var(--accent);color:#fff}
  .chip.mine::after{content:' ✕';font-size:.8rem;opacity:.8}
  .quick{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .quick summary{cursor:pointer;color:var(--muted);font-size:.95rem;padding:4px 0}
  .quick .chips{margin-top:8px}
  .quick .chip.on{opacity:.45}
  .more{margin-top:16px}
  .more b{display:block;margin-bottom:2px}
  .more p{margin:0 0 10px;font-size:.88rem;color:var(--muted)}
  .chip.alt{font-size:.95rem;padding:8px 13px}
  .chip.alt small{color:var(--muted);font-size:.78rem}
  .web{margin-top:16px;border-radius:14px;border:1.5px dashed var(--line);padding:14px 16px}
  .web b{display:block;margin-bottom:2px}
  .web p{margin:0 0 10px;font-size:.88rem;color:var(--muted)}
  .web input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;font-size:1rem;background:var(--bg);color:var(--ink);-webkit-appearance:none}
  .links{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
  .links a{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:11px 4px;font-size:.92rem;font-weight:700;background:var(--warm-soft);color:var(--warm)}
  .note{font-size:.92rem;color:var(--warm);margin:10px 0 0}
  .tabs{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--bg);padding:10px 0 8px;margin:6px 0 4px}
  .tabs button{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px 4px;font:inherit;font-size:.92rem;font-weight:700;cursor:pointer}
  .tabs button.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}

<body class="sky">
<div class="skyfx" id="skyfx"></div>
<div class="wrap home" id="v-home">
  <div class="hometop"><button type="button" class="bigbtn" id="bigBtn">가+ 글자 크게</button></div>
  <p class="date" id="date"></p>
  <h1>오늘</h1>
  <a class="pick cook" id="toCook" href="#"><span class="pic"><span class="pe">🍲</span></span><span class="ptxt"><b>뭐 해먹지?</b><small>집밥 추천 · 일주일 식단표</small></span><span class="parr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span></a>
  <a class="pick order" id="toOrder" href="#"><span class="pic"><span class="pe">🛵</span></span><span class="ptxt"><b>뭐 시키지?</b><small>배달 메뉴 추천</small></span><span class="parr" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></span></a>
  <a class="smallpick" id="toGames" href="#games">🎲 오늘은 니가 내라</a>
  <p class="recent" id="recent"></p>
  <button type="button" class="statpill" id="statBtn" hidden></button>
  <button type="button" class="installbtn" id="installBtn" hidden>📲 앱으로 설치하기</button>
</div>
<div class="ibg" id="ibg" hidden><div class="ibox" id="ibox" role="dialog" aria-modal="true"></div></div>
<div class="wrap games" id="v-games" hidden>
  <div class="gtop"><a class="homebtn" href="#" id="gBack"><span class="chev">‹</span>처음으로</a></div>
  <h1 class="gh1">🎲 오늘은 니가 내라</h1>

  <div class="gcard">
    <p class="gq">참가자 <small id="pcount"></small></p>
    <form class="addrow" id="pForm">
      <input id="pInput" type="text" placeholder="이름 (쉼표로 여러 명)" autocomplete="off" enterkeyhint="done">
      <button type="submit">추가</button>
    </form>
    <div class="quickn" id="quickn">
      <span>이름 없이 인원만:</span>
      <button type="button" data-n="2">2명</button><button type="button" data-n="3">3명</button><button type="button" data-n="4">4명</button><button type="button" data-n="5">5명</button><button type="button" data-n="6">6명</button>
    </div>
    <div class="pchips" id="pList"></div>
  </div>

  <div class="gtabs" id="gtabs">
    <button data-g="ladder" class="on">🪜<span>사다리</span></button>
    <button data-g="wheel">🎡<span>룰렛</span></button>
    <button data-g="cards">🃏<span>제비뽑기</span></button>
    <button data-g="split">🧮<span>N분의1</span></button>
  </div>

  <!-- 사다리 -->
  <div class="gcard gpane" id="g-ladder">
    <p class="gq">사다리 타기 <small>결과를 정하고 사다리를 만드세요</small></p>
    <div id="lResults"></div>
    <button class="gbtn" id="lMake">사다리 만들기</button>
    <div id="lBoard"></div>
  </div>

  <!-- 룰렛 -->
  <div class="gcard gpane" id="g-wheel" hidden>
    <p class="gq">룰렛 <small>한 명을 뽑아요</small></p>
    <div class="wheelbox">
      <div class="pointer">▼</div>
      <div class="wspin" id="wRot"><svg id="wheel" viewBox="-110 -110 220 220"></svg></div>
      <div class="whub"></div>
    </div>
    <p class="wres" id="wRes"></p>
    <button class="gbtn" id="wSpin">돌리기!</button>
    <button class="gsub" id="wDrop" hidden>뽑힌 사람 빼고 다시 돌리기</button>
  </div>

  <!-- 제비뽑기 -->
  <div class="gcard gpane" id="g-cards" hidden>
    <p class="gq">제비뽑기 <small>휴대폰을 돌려 가며 한 장씩 뒤집어요</small></p>
    <div class="stepper"><span id="cLabel">당첨 개수</span><button type="button" id="cMinus">−</button><b id="cWin">1</b><button type="button" id="cPlus">+</button></div>
    <div class="cgrid" id="cGrid"></div>
    <p class="wres" id="cRes"></p>
    <button class="gbtn" id="cShuffle">다시 섞기</button>
  </div>

  <!-- N분의1 -->
  <div class="gcard gpane" id="g-split" hidden>
    <p class="gq">N분의1 계산기</p>
    <label class="glab" for="sTotal">총 금액 (원)</label>
    <input class="ginput" id="sTotal" type="text" inputmode="numeric" placeholder="예: 45,000">
    <div class="srow">
      <div><label class="glab">나눌 인원</label><div class="stepper"><button type="button" id="sMinus">−</button><b id="sN">2</b><button type="button" id="sPlus">+</button><span>명</span></div></div>
      <div><label class="glab">빠지는 사람</label><div class="stepper"><button type="button" id="xMinus">−</button><b id="sX">0</b><button type="button" id="xPlus">+</button><span>명</span></div></div>
    </div>
    <label class="glab">끝자리</label>
    <div class="seg" id="sUnit"><button type="button" data-u="1">1원까지</button><button type="button" data-u="100" class="on">100원 단위</button><button type="button" data-u="1000">1,000원 단위</button></div>
    <div class="sout" id="sOut"><p class="empty">총 금액을 넣어 주세요.</p></div>
    <button class="gsub" id="sCopy" hidden>📋 결과 복사 (카톡에 붙여넣기)</button>
  </div>
</div>
<script>
// GitHub Pages(아이디.github.io)에서는 같은 계정의 /dinner/, /delivery/ 로, 그 밖에서는 Claude 링크로 이동
const GH = /github\.io$/.test(location.hostname);
document.getElementById('toCook').href  = GH ? './dinner/'   : 'https://claude.ai/artifact/YYh3ntdGB59dDcM5Wfk9CT';
document.getElementById('toOrder').href = GH ? './delivery/' : 'https://claude.ai/artifact/VSAtKR51naycm66LRPTD5A';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// ---- 시간대별 하늘 (시각: 하늘 위색, 아래색, 글자색, 해/달) ----
const SKIES=[
  // [시작 시각, 위, 가운데, 아래, 글자, 알약 배경, 해/달 종류]
  [0,   '#0f1b3d','#1d2b5c','#2e3a6e','#f3f1ff','rgba(255,255,255,.14)','moon'],   // 밤
  [5,   '#f6c9a8','#f9dfc4','#fdf1e2','#3a2a22','rgba(255,255,255,.55)','dawn'],   // 새벽
  [7,   '#bfe0f5','#dcefff','#f7f4ee','#24313b','rgba(255,255,255,.6)','sun'],     // 아침
  [11,  '#8fcaf0','#c3e4fa','#f2f7fb','#1f2d38','rgba(255,255,255,.6)','sun'],     // 낮
  [16,  '#f7b26a','#f6a081','#f3c6b8','#3a2320','rgba(255,255,255,.5)','sunset'],  // 해 질 녘
  [18.5,'#5a3d7a','#c0607a','#f19a6b','#fff6f0','rgba(255,255,255,.18)','dusk'],   // 노을
  [20,  '#0f1b3d','#1d2b5c','#2e3a6e','#f3f1ff','rgba(255,255,255,.14)','moon'],   // 밤
];
function skyFor(hour){ let s=SKIES[0]; for(const x of SKIES) if(hour>=x[0]) s=x; return s; }
let starsMade=false;
function paintSky(hour){
  const [,a,b,c,ink,pill,kind]=skyFor(hour);
  const st=document.body.style;
  st.setProperty('--sky',`linear-gradient(180deg, ${a} 0%, ${b} 55%, ${c} 100%)`);
  st.setProperty('--skyink',ink); st.setProperty('--pill',pill);
  document.querySelector('meta[name="theme-color"]')?.setAttribute('content',a);
  const fx=$('skyfx');
  let orb=fx.querySelector('.orb'); if(!orb){ orb=document.createElement('div'); orb.className='orb'; fx.appendChild(orb); }
  const O={
    sun:   {w:110,top:'7%', left:'72%',bg:'radial-gradient(circle,#fff7d1 0%,#ffe28a 45%,rgba(255,226,138,0) 70%)'},
    dawn:  {w:160,top:'70%',left:'12%',bg:'radial-gradient(circle,#fff1c9 0%,#ffc58a 40%,rgba(255,197,138,0) 70%)'},
    sunset:{w:200,top:'86%',left:'30%',bg:'radial-gradient(circle,#fff0c2 0%,#ffb36b 40%,rgba(255,140,90,0) 70%)'},
    dusk:  {w:220,top:'80%',left:'50%',bg:'radial-gradient(circle,#ffd8a8 0%,#ff8a6a 35%,rgba(255,120,100,0) 70%)'},
    moon:  {w:70, top:'8%', left:'74%',bg:'radial-gradient(circle at 40% 40%,#fffbe8 0%,#f1ecd2 55%,rgba(241,236,210,0) 72%)'},
  }[kind];
  Object.assign(orb.style,{width:O.w+'px',height:O.w+'px',top:O.top,left:O.left,transform:'translate(-50%,-50%)',background:O.bg,boxShadow:kind==='moon'?'0 0 40px rgba(255,250,220,.35)':'none'});
  const night = kind==='moon' || kind==='dusk';
  document.body.classList.toggle('isnight', night);
  if(night && !starsMade){
    starsMade=true;
    for(let i=0;i<40;i++){ const s=document.createElement('div'); s.className='star';
      s.style.top=(Math.random()*55)+'%'; s.style.left=(Math.random()*100)+'%'; s.style.animationDelay=(Math.random()*3)+'s';
      const z=Math.random()<.2?3:2; s.style.width=s.style.height=z+'px'; fx.appendChild(s); }
  }
  fx.querySelectorAll('.star').forEach(s=>{ s.style.display = night?'block':'none'; s.style.opacity = kind==='dusk'?'.5':''; });
}
function nowHour(){ const d=new Date(); return d.getHours()+d.getMinutes()/60; }

// ---- 날짜 ----
function paintDate(){ const d=new Date(); $('date').textContent=`${d.getMonth()+1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`; }

// ---- 최근에 먹은 것 한 줄 (두 앱이 같이 쓰는 기록) ----
function paintRecent(){
  // 식단표에 오늘 메뉴가 있으면 그걸 먼저 보여 줌
  try{
    const P=JSON.parse(localStorage.getItem('dn_plan')||'null'), n=new Date();
    const key=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;
    const t=P && P.days && P.days.find(x=>x.date===key);
    if(t && t.dishes.length && !t.done){ $('recent').innerHTML=`🗓 오늘 저녁 식단: <b>${t.dishes.map(esc).join(' + ')}</b>`; return; }
  }catch(e){}
  let H=[]; try{ H=JSON.parse(localStorage.getItem('dn_hist'))||[]; }catch(e){}
  const last=H.slice().sort((a,b)=>b.ts-a.ts)[0];
  if(!last){ $('recent').textContent=''; return; }
  const DAY=86400000;
  const d=Math.round((new Date().setHours(0,0,0,0)-new Date(last.ts).setHours(0,0,0,0))/DAY);
  const when=d===0?'오늘은':d===1?'어제는':d+'일 전엔';
  const icon=last.kind==='order'?'🛵':'🍲';
  const what=last.names.slice(0,2).join(' + ');
  $('recent').innerHTML = d===0 ? `오늘은 ${icon} ${esc(what)} 먹기로 했어요` : `${when} ${icon} ${esc(what)} 먹었어요`;
}

function paintAll(){ paintSky(nowHour()); paintDate(); paintRecent(); }
paintAll();
setInterval(()=>paintSky(nowHour()),60000);
window.addEventListener('pageshow',paintAll);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) paintAll(); });
window.__sky=paintSky; // 테스트용

// ================= 화면 전환: 첫 화면 ↔ 게임 =================
let WIN=['💸','당첨'], MODE='';
function setMode(m){
  if(m===MODE) return; MODE=m;
  const d = m==='#dishes';
  WIN = d ? ['🧽','설거지'] : ['💸','당첨'];
  document.querySelector('.gh1').textContent = d ? '🧽 설거지는 누가?' : '🎲 오늘은 니가 내라';
  document.getElementById('cLabel').textContent = `${WIN[1]} 개수`;
  if(typeof L!=='undefined'){ L.results=[]; L.built=null; document.getElementById('lBoard').innerHTML=''; }
  if(typeof C!=='undefined') C.deck=null;
}
function showView(){
  const g = location.hash === '#games' || location.hash === '#dishes';
  if(g) setMode(location.hash);
  document.getElementById('v-home').hidden = g;
  document.getElementById('v-games').hidden = !g;
  window.scrollTo(0,0);
  if(g) renderGame();
}
window.addEventListener('hashchange', showView);
document.getElementById('toGames').onclick = e => { e.preventDefault(); location.hash = 'games'; };
document.getElementById('gBack').onclick = e => { e.preventDefault(); location.hash=''; };

// ================= 참가자 (저장하지 않음) =================
const G = { names:[], game:'ladder' };
const gq = id => document.getElementById(id);
function setNames(list){ G.names = list.slice(0,12); if(typeof W!=='undefined'){ W.pool=null; W.rot=0; W.spinning=false; } renderPeople(); renderGame(); }
gq('pForm').addEventListener('submit', e => {
  e.preventDefault();
  const words = gq('pInput').value.split(/[,，、\n]+/).map(s=>s.trim().slice(0,10)).filter(Boolean);
  if(!words.length) return;
  const next = G.names.filter(n=>!/^\d+번$/.test(n)); // '1번' 같은 임시 이름은 실제 이름이 들어오면 정리
  words.forEach(w=>{ let n=w, k=2; while(next.includes(n)) n=w+(k++); next.push(n); });
  gq('pInput').value=''; setNames(next);
});
gq('quickn').querySelectorAll('button').forEach(b => b.onclick = () => {
  const n = +b.dataset.n; setNames(Array.from({length:n},(_,i)=>`${i+1}번`));
});
function renderPeople(){
  gq('pcount').textContent = G.names.length ? `${G.names.length}명` : '';
  gq('pList').innerHTML = G.names.length ? '' : '<p class="empty">2명 이상 넣어 주세요.</p>';
  G.names.forEach((n,i) => {
    const b=document.createElement('button'); b.type='button'; b.className='pchip'; b.textContent=n;
    b.onclick=()=>{ const l=[...G.names]; l.splice(i,1); setNames(l); };
    gq('pList').appendChild(b);
  });
  // N분의1 인원도 참가자 수로 맞춤
  if(G.names.length>=1){ S2.n = G.names.length; if(S2.x>=S2.n) S2.x=S2.n-1; renderSplit(); }
}
gq('gtabs').querySelectorAll('button').forEach(b => b.onclick = () => {
  G.game=b.dataset.g;
  gq('gtabs').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));
  ['ladder','wheel','cards','split'].forEach(k=>gq('g-'+k).hidden = k!==G.game);
  renderGame();
});
function renderGame(){
  if(G.game==='ladder') renderLadderSetup();
  if(G.game==='wheel') renderWheel();
  if(G.game==='cards') renderCards();
  if(G.game==='split') renderSplit();
}
const COLORS=['#e4572e','#3d7a4f','#2e86de','#f39c12','#8e44ad','#16a085','#d35400','#c0392b','#2c3e50','#27ae60','#e84393','#0984e3'];
const escG = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

// ================= 사다리 =================
const L = { results:[], built:null };
function defaultResults(n, win=1){ return Array.from({length:n},(_,i)=> i<win ? `${WIN[0]} ${WIN[1]}` : '통과'); }
function renderLadderSetup(){
  const n=G.names.length;
  if(n<2 || n>8){ gq('lResults').innerHTML = `<p class="empty">${n>8?'사다리는 8명까지 할 수 있어요.':'참가자를 2명 이상 넣어 주세요.'}</p>`; gq('lMake').disabled=true; gq('lBoard').innerHTML=''; L.built=null; return; }
  gq('lMake').disabled=false;
  if(L.results.length!==n) L.results = defaultResults(n);
  gq('lResults').innerHTML = `<div class="preset"><button type="button" data-w="1">${WIN[1]} 1명</button>${n>2?`<button type="button" data-w="2">${WIN[1]} 2명</button>`:''}<button type="button" data-w="order">순서 정하기</button></div>
    <div class="lres">${L.results.map((r,i)=>`<label><span>${i+1}</span><input data-i="${i}" value="${escG(r)}" maxlength="12"></label>`).join('')}</div>`;
  gq('lResults').querySelectorAll('input').forEach(inp=>inp.oninput=()=>{ L.results[+inp.dataset.i]=inp.value.trim()||'통과'; });
  gq('lResults').querySelectorAll('.preset button').forEach(b=>b.onclick=()=>{
    L.results = b.dataset.w==='order' ? Array.from({length:n},(_,i)=>`${i+1}등`) : defaultResults(n,+b.dataset.w);
    renderLadderSetup();
  });
  if(L.built && L.built.n!==n){ L.built=null; gq('lBoard').innerHTML=''; }
}
gq('lMake').onclick = () => {
  const n=G.names.length; if(n<2||n>8) return;
  const R=10, rungs=[];
  for(let r=0;r<R;r++){ const row=[]; for(let c=0;c<n-1;c++){ row.push(!row[c-1] && Math.random()<.42); } rungs.push(row); }
  // 이웃한 두 줄 사이에 가로줄이 하나도 없으면 하나 넣기
  for(let c=0;c<n-1;c++){ if(!rungs.some(row=>row[c])){ for(let tries=0;tries<20;tries++){ const r=Math.floor(Math.random()*R); if(!rungs[r][c-1] && !rungs[r][c+1]){ rungs[r][c]=true; break; } } } }
  L.built = { n, R, rungs, results: shuffle(L.results), revealed:new Set() };
  drawLadder();
};
function ladderTrace(start){
  const {R,rungs}=L.built; let c=start; const steps=[[c,-1]];
  for(let r=0;r<R;r++){ if(rungs[r][c]){ steps.push([c,r]); c=c+1; steps.push([c,r]); } else if(c>0 && rungs[r][c-1]){ steps.push([c,r]); c=c-1; steps.push([c,r]); } }
  steps.push([c,R]); return {steps,end:c};
}
function drawLadder(){
  const {n,R,rungs,results}=L.built;
  const W=320, top=46, bottom=48, H=360, gap=W/n, X=c=>gap*c+gap/2, rowH=(H-top-bottom)/(R+1), Y=r=>top+rowH*(r+1);
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;
  for(let c=0;c<n;c++) s+=`<line x1="${X(c)}" y1="${top}" x2="${X(c)}" y2="${H-bottom}" stroke="#cfc4b6" stroke-width="4" stroke-linecap="round"/>`;
  rungs.forEach((row,r)=>row.forEach((on,c)=>{ if(on) s+=`<line x1="${X(c)}" y1="${Y(r)}" x2="${X(c+1)}" y2="${Y(r)}" stroke="#cfc4b6" stroke-width="4" stroke-linecap="round"/>`; }));
  s+=`<g id="lPaths"></g>`;
  G.names.forEach((nm,c)=>{ s+=`<g class="lname" data-c="${c}"><rect x="${X(c)-gap/2+3}" y="4" width="${gap-6}" height="34" rx="10" fill="${COLORS[c%COLORS.length]}"/><text x="${X(c)}" y="26" text-anchor="middle" font-size="${n>6?11:13}" font-weight="800" fill="#fff">${escG(nm.length>5?nm.slice(0,5)+'…':nm)}</text></g>`; });
  results.forEach((r,c)=>{ s+=`<g id="lr${c}"><rect x="${X(c)-gap/2+3}" y="${H-40}" width="${gap-6}" height="34" rx="10" fill="#efe8de"/><text x="${X(c)}" y="${H-18}" text-anchor="middle" font-size="16" font-weight="800" fill="#7d736a">?</text></g>`; });
  s+='</svg>';
  gq('lBoard').innerHTML = s + `<p class="lhint">위의 이름을 누르면 사다리를 타요</p><button class="gsub" id="lAll">전체 결과 한 번에 보기</button>`;
  gq('lBoard').querySelectorAll('.lname').forEach(g=>g.onclick=()=>runPath(+g.dataset.c));
  gq('lAll').onclick=()=>{ for(let c=0;c<n;c++) if(!L.built.revealed.has(c)) runPath(c,true); };
  L.geom={X,Y,top,H,bottom,gap};
}
function runPath(c, fast){
  const B=L.built; if(!B || B.revealed.has(c)) return; B.revealed.add(c);
  const {X,Y,top,H,bottom,gap}=L.geom; const {steps,end}=ladderTrace(c);
  const pts=steps.map(([cc,r])=>[X(cc), r<0?top:(r>=B.R?H-bottom:Y(r))]);
  const d='M'+pts.map(p=>p.join(',')).join(' L');
  const ns='http://www.w3.org/2000/svg', path=document.createElementNS(ns,'path');
  path.setAttribute('d',d); path.setAttribute('class','lpath'); path.setAttribute('stroke',COLORS[c%COLORS.length]);
  gq('lPaths').appendChild(path);
  const len=path.getTotalLength(); path.style.strokeDasharray=len; path.style.strokeDashoffset=len;
  const dur = fast ? 600 : 1600;
  path.getBoundingClientRect(); path.style.transition=`stroke-dashoffset ${dur}ms linear`; path.style.strokeDashoffset=0;
  setTimeout(()=>{
    const g=gq('lr'+end), res=B.results[end], win=/당첨|1등|설거지/.test(res);

const W = { rot:0, pool:null, spinning:false };
function wheelPool(){ return (W.pool && W.pool.length>=2 && W.pool.every(x=>G.names.includes(x))) ? W.pool : (W.pool=[...G.names]); }
function renderWheel(){
  const pool=wheelPool(), n=pool.length;
  gq('wSpin').disabled = n<2; gq('wDrop').hidden = true;
  if(n<2){ gq('wheel').innerHTML=`<circle r="100" fill="#efe8de"/><text text-anchor="middle" y="5" font-size="12" fill="#7d736a">참가자를 2명 이상 넣어 주세요</text>`; gq('wRes').textContent=''; return; }
  const a=360/n, rad=d=>(d-90)*Math.PI/180, P=(r,d)=>[r*Math.cos(rad(d)), r*Math.sin(rad(d))];
  let s=`<g>`; gq('wRot').style.transition='none'; gq('wRot').style.transform=`rotate(${W.rot}deg)`;
  pool.forEach((nm,i)=>{
    const [x1,y1]=P(100,i*a), [x2,y2]=P(100,(i+1)*a), mid=i*a+a/2, [tx,ty]=P(62,mid);
    s+=`<path d="M0,0 L${x1},${y1} A100,100 0 ${a>180?1:0},1 ${x2},${y2} Z" fill="${COLORS[i%COLORS.length]}" stroke="#fff" stroke-width="2"/>`;
    s+=`<text x="${tx}" y="${ty}" transform="rotate(${mid} ${tx} ${ty})" text-anchor="middle" dominant-baseline="middle" font-size="${n>8?10:13}" font-weight="800" fill="#fff">${escG(nm.length>6?nm.slice(0,6)+'…':nm)}</text>`;
  });
  s+=`</g>`;
  gq('wheel').innerHTML=s;
}
gq('wSpin').onclick=()=>{
  const pool=wheelPool(), n=pool.length; if(n<2 || W.spinning) return;
  W.spinning=true; gq('wRes').textContent='두구두구… 🥁'; gq('wDrop').hidden=true;
  W.rot += 360*5 + Math.random()*360;
  const g=gq('wRot'); g.style.transition=''; g.getBoundingClientRect(); requestAnimationFrame(()=>{ g.style.transform=`rotate(${W.rot}deg)`; });
  setTimeout(()=>{

};

const C = { win:1, deck:null, n:0 };
function newDeck(){ const n=Math.max(2,G.names.length||0); C.n=n; if(C.win>=n) C.win=n-1; C.deck=shuffle(Array.from({length:n},(_,i)=>i<C.win)); C.open=new Set(); }
function renderCards(){

  if(n<2){ gq('cGrid').innerHTML='<p class="empty">참가자를 2명 이상 넣어 주세요. (인원만 골라도 돼요)</p>'; gq('cRes').textContent=''; gq('cWin').textContent=C.win; return; }

const S2 = { n:2, x:0, unit:100 };
const fmt = v => Math.round(v).toLocaleString('ko-KR');
gq('sTotal').addEventListener('input', e=>{
  const raw=e.target.value.replace(/[^\d]/g,'').slice(0,9);
  e.target.value = raw ? Number(raw).toLocaleString('ko-KR') : '';
  renderSplit();
});

gq('xMinus').onclick=()=>{ if(S2.x>0){ S2.x--; renderSplit(); } };

function splitText(){
  const total=Number(gq('sTotal').value.replace(/[^\d]/g,''))||0, payers=S2.n-S2.x;
  if(!total || payers<1) return null;
  const u=S2.unit, each=Math.ceil(total/payers/u)*u, sum=each*payers, extra=sum-total;
  const floorEach=Math.floor(total/payers/u)*u, rest=total-floorEach*(payers-1);
  return {total,payers,each,extra,floorEach,rest};
}
function renderSplit(){
  gq('sN').textContent=S2.n; gq('sX').textContent=S2.x;
  const r=splitText();
  if(!r){ gq('sOut').innerHTML='<p class="empty">총 금액을 넣어 주세요.</p>'; gq('sCopy').hidden=true; return; }
  let h=`<p>${fmt(r.total)}원을 <b>${r.payers}명</b>이 나눠요${S2.x?` (${S2.x}명 빠짐)`:''}</p>

  gq('sOut').innerHTML=h; gq('sCopy').hidden=false;
}
gq('sCopy').onclick=async()=>{

function monthStats(offset=0){
  let H=[]; try{ H=JSON.parse(localStorage.getItem('dn_hist'))||[]; }catch(e){}
  const now=new Date(), y=now.getFullYear(), m=now.getMonth()+offset;
  const start=new Date(y,m,1).getTime(), end=new Date(y,m+1,1).getTime();
  const list=H.filter(h=>h.ts>=start && h.ts<end);
  const orders=list.filter(h=>h.kind==='order'), cooks=list.filter(h=>h.kind!=='order');
  const known=orders.filter(h=>h.won>0), spend=known.reduce((a,h)=>a+h.won,0);
  const cnt={}; list.forEach(h=>h.names.forEach(n=>{ cnt[n]=(cnt[n]||0)+1; }));
  const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]).slice(0,3);
  return {month:new Date(y,m,1).getMonth()+1, total:list.length, cook:cooks.length, order:orders.length, spend, unknown:orders.length-known.length, top};
}

function gcEvent(name){
  try{
    if(window.goatcounter && window.goatcounter.count){ window.goatcounter.count({path:name, title:name, event:true}); }
    else { (window.__gcq=window.__gcq||[]).push(name); }
  }catch(e){}
}

window.addEventListener('load',()=>setTimeout(()=>{ (window.__gcq||[]).splice(0).forEach(gcEvent); },1500));
function gcTrack(map){
  // 버튼이 화면에서 바뀌기 전에 세려고 capture 단계에서 잡음
  document.addEventListener('click',e=>{
    for(const [sel,name] of map){ const t=e.target.closest && e.target.closest(sel); if(t){ gcEvent(typeof name==='function'?name(t):name); break; } }
  },true);
}
